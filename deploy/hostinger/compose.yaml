name: btw-visa-operations
services:
  app:
    build:
      context: ../..
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in deploy/hostinger/.env}
      PORT: '3000'
      AUTH_DB_PATH: /data/auth.sqlite
    volumes:
      - auth_data:/data
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/healthz",{headers:{Host:new URL(process.env.APP_ORIGIN).host}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  web:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in deploy/hostinger/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/hostinger/.env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  auth_data:
    name: btw_visa_hostinger_auth
  caddy_data:
    name: btw_visa_hostinger_tls
  caddy_config:
    name: btw_visa_hostinger_caddy
