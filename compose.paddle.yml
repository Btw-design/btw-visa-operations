services:
  paddle:
    build: ./ocr-service
    environment:
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:?Generate paddle.env first}
    volumes:
      - paddle_models:/models
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz',headers={'Authorization':'Bearer '+os.environ['OCR_SERVICE_TOKEN']}),timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 180s
  web:
    build: .
    command: ["node", "server/server.mjs"]
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://${SITE_HOST:?Set SITE_HOST in paddle.env}
      PADDLE_OCR_URL: http://paddle:8000
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:?Generate paddle.env first}
    expose:
      - "3000"
    depends_on:
      paddle:
        condition: service_healthy
    restart: unless-stopped
  https:
    image: caddy:2.10.2
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST in paddle.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server/Caddyfile.paddle:/etc/caddy/Caddyfile:ro
      - https_data:/data
      - https_config:/config
    depends_on:
      - web
    restart: unless-stopped
volumes:
  paddle_models:
  https_data:
  https_config:
